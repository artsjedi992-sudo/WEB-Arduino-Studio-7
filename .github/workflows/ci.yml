name: Web IDE validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/storage.js
          node --check assets/js/syntax.js
          node --check assets/js/editor.js
          node --check assets/js/project-manager.js
          node --check assets/js/compiler.js
          node --check assets/js/app.js
          node --check assets/js/panel-layout.js
      - name: Check required web files
        run: |
          test -s index.html
          test -s assets/css/app.css
          test -s README.md
